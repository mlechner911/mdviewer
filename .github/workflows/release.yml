name: Wails Release Build

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: 'ubuntu-22.04'
            build-cmd: 'wails3 task build'
            artifact-name: 'linux-amd64'
          - os: 'windows-latest'
            build-cmd: 'wails3 task windows:package ARCH=amd64'
            artifact-name: 'windows-amd64'
          - os: 'macos-latest'
            build-cmd: 'wails3 task darwin:package ARCH=arm64'
            artifact-name: 'macos-arm64'

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.17

      - name: Install Linux Dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install NSIS (Windows)
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          choco install nsis -y -v
          $nsisPath = "C:\Program Files (x86)\NSIS"
          if (!(Test-Path $nsisPath)) {
            $nsisPath = "C:\Program Files\NSIS"
          }
          echo "$nsisPath" >> $env:GITHUB_PATH
          # Verify using full path
          & "$nsisPath\makensis.exe" /VERSION

      - name: Build App
        run: ${{ matrix.build-cmd }}

      - name: Debug - List Build Files
        shell: bash
        run: ls -R bin/

      - name: Prepare Linux Artifact
        if: matrix.os == 'ubuntu-22.04'
        run: |
          mv bin/marksafe bin/marksafe-linux-amd64
          chmod +x bin/marksafe-linux-amd64

      - name: Package macOS
        if: matrix.os == 'macos-latest'
        run: |
          cd bin
          zip -r marksafe-macos-arm64.zip *.app

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: marksafe-${{ matrix.artifact-name }}
          path: |
            bin/*.exe
            bin/marksafe-linux-amd64
            bin/*.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.exe
            artifacts/**/*.zip
            artifacts/**/marksafe-linux-amd64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
