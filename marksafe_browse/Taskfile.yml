version: '3'

tasks:
  default:
    cmds:
      - task: dev
    desc: "Default: start dev mode"

  frontend:
    dir: frontend
    cmds:
      - npx vite build
      - cp ../internal/browse/frontend/dist/assets/index.css ../internal/browse/assets/style.css
      - cp ../internal/browse/frontend/dist/assets/index.js ../internal/browse/assets/index.js
    desc: "Build Svelte frontend and sync into Go embedded assets"
    sources:
      - src/**/*
      - index.html
      - vite.config.ts
      - package.json
    generates:
      - ../internal/browse/assets/index.js
      - ../internal/browse/assets/style.css

  dev:
    deps: [frontend]
    cmds:
      - go build -o bin/marksafe_browse ./cmd/marksafe_browse && ./bin/marksafe_browse --path ./example --port 8312
    desc: "Build frontend + backend and run marksafe_browse in dev mode"

  build:
    deps: [frontend]
    cmds:
      - mkdir -p bin && go build -o bin/marksafe_browse ./cmd/marksafe_browse
    desc: "Build the marksafe_browse binary into bin/"

  build:linux:
    deps: [frontend]
    cmds:
      - mkdir -p bin && GOOS=linux GOARCH=amd64 go build -o bin/marksafe_browse ./cmd/marksafe_browse
    desc: "Build Linux AMD64 binary"

  build:windows:
    deps: [frontend]
    cmds:
      - mkdir -p bin && GOOS=windows GOARCH=amd64 go build -o bin/marksafe_browse.exe ./cmd/marksafe_browse
    desc: "Build Windows binary"

  build:all:
    cmds:
      - task: build:linux
      - task: build:windows
    desc: "Build for all platforms"

  release:
    cmds:
      - task: build:linux
      - task: build:windows
      - mkdir -p /mnt/data2tb/dropzone
      - cp bin/marksafe_browse /mnt/data2tb/dropzone/marksafe_browse-linux-amd64
      - cp bin/marksafe_browse.exe /mnt/data2tb/dropzone/marksafe_browse-windows-amd64.exe
    desc: "Build all platforms and copy to /mnt/data2tb/dropzone/"

  tidy:
    cmds:
      - go mod tidy
    desc: "Tidy go modules"

  check:
    cmds:
      - go vet ./...
      - go test ./...
    desc: "Run go vet and tests"

  install:
    cmds:
      - task: build
      - cp bin/marksafe_browse /usr/local/bin/marksafe_browse
    desc: "Build and install to /usr/local/bin"

  clean:
    cmds:
      - rm -rf bin
      - rm -rf internal/browse/frontend/dist
    desc: "Remove built binary and frontend dist"
