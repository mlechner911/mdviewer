version: '3'

tasks:
  default:
    cmds:
      - task: dev
    silent: true
    desc: Default: start dev mode

  dev:
    desc: Build and run marksafe_browse in dev mode
    cmds:
      - go build -o marksafe_browse ./cmd/marksafe_browse && ./marksafe_browse --path ./example

  build:
    desc: Build the marksafe_browse binary
    cmds:
      - go build -o marksafe_browse ./cmd/marksafe_browse

  build:linux:
    desc: Build Linux AMD64 binary
    cmds:
      - GOOS=linux GOARCH=amd64 go build -o marksafe_browse ./cmd/marksafe_browse

  build:windows:
    desc: Build Windows binary
    cmds:
      - GOOS=windows GOARCH=amd64 go build -o marksafe_browse.exe ./cmd/marksafe_browse

  build:all:
    desc: Build for all platforms
    cmds:
      - task: build:linux
      - task: build:windows
    silent: true

  tidy:
    desc: Tidy go modules
    cmds:
      - go mod tidy

  check:
    desc: Run go vet and tests
    cmds:
      - go vet ./...
      - go test ./...
    silent: true

  install:
    desc: Build and install to $PATH
    cmds:
      - go build -o $(which marksafe_browse 2>/dev/null || echo /usr/local/bin/marksafe_browse) ./cmd/marksafe_browse
    silent: true
