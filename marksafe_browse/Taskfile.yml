version: '3'

tasks:
  default:
    cmds:
      - task: dev
    desc: "Default: start dev mode"

  dev:
    cmds:
      - go build -o bin/marksafe_browse ./cmd/marksafe_browse && ./bin/marksafe_browse --path ./example --port 8080
    desc: "Build and run marksafe_browse in dev mode"

  build:
    cmds:
      - mkdir -p bin && go build -o bin/marksafe_browse ./cmd/marksafe_browse
    desc: "Build the marksafe_browse binary into bin/"

  build:linux:
    cmds:
      - mkdir -p bin && GOOS=linux GOARCH=amd64 go build -o bin/marksafe_browse ./cmd/marksafe_browse
    desc: "Build Linux AMD64 binary"

  build:windows:
    cmds:
      - mkdir -p bin && GOOS=windows GOARCH=amd64 go build -o bin/marksafe_browse.exe ./cmd/marksafe_browse
    desc: "Build Windows binary"

  build:all:
    cmds:
      - task: build:linux
      - task: build:windows
    desc: "Build for all platforms"

  release:
    cmds:
      - task: build:linux
      - task: build:windows
      - mkdir -p /mnt/data2tb/dropzone
      - cp bin/marksafe_browse /mnt/data2tb/dropzone/marksafe_browse-linux-amd64
      - cp bin/marksafe_browse.exe /mnt/data2tb/dropzone/marksafe_browse-windows-amd64.exe
    desc: "Build all platforms and copy to /mnt/data2tb/dropzone/"

  tidy:
    cmds:
      - go mod tidy
    desc: "Tidy go modules"

  check:
    cmds:
      - go vet ./...
      - go test ./...
    desc: "Run go vet and tests"

  install:
    cmds:
      - task: build
      - cp bin/marksafe_browse /usr/local/bin/marksafe_browse
    desc: "Build and install to /usr/local/bin"

  clean:
    cmds:
      - rm -rf bin
    desc: "Remove built binary"
