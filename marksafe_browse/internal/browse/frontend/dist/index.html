<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MarkSafe Browse</title>
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <script>
    (function() {
      const stored = localStorage.getItem('marksafe-theme');
      if (stored) document.body.className = stored;
      else if (window.matchMedia('(prefers-color-scheme: dark)').matches) document.body.className = 'dark';
      else document.body.className = 'light';
    })();
  </script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
