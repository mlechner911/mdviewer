# Wails v3 build configuration for MarkSafe.
# When you update `info` or `fileAssociations`, run `wails3 task common:update:build-assets`
# (this overwrites manual changes to the generated assets, e.g. the NSIS file associations).
version: '3'

info:
  companyName: "Michael Lechner"
  productName: "MarkSafe"
  productIdentifier: "eu.mlcgo.marksafe"
  description: "Markdown viewer and editor"
  copyright: "Copyright © 2026 Michael Lechner"
  comments: "Ein einfach zu bedienender, plattformübergreifender Markdown-Betrachter und -Editor."
  version: "1.5.1"

# Dev mode configuration (wails3 dev)
dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - node_modules
      - frontend
      - bin
      - .mlcai
      - mlcprodweb
    file:
      - .DS_Store
      - .gitignore
      - .gitkeep
      - "*_test.go"
    watched_extension:
      - "*.go"
    git_ignore: true
  executes:
    - cmd: wails3 build DEV=true
      type: blocking
    - cmd: wails3 task common:dev:frontend
      type: background
    - cmd: wails3 task run
      type: primary

fileAssociations:
  - ext: md
    name: Markdown File
    description: Markdown formatted text file
    iconName: icons
    role: Editor
  - ext: markdown
    name: Markdown File
    description: Markdown formatted text file
    iconName: icons
    role: Editor
  - ext: mdown
    name: Markdown File
    description: Markdown formatted text file
    iconName: icons
    role: Editor
