# MarkSafe — Wails v3 build & release pipeline.
#
# The platform build/package steps come from the wails3 scaffold in build/
# (build/Taskfile.yml + build/{linux,windows,darwin}/Taskfile.yml). This file
# adds the MarkSafe-specific release flow (dropzone, remote macOS signing,
# web downloads) on top.
version: '3'

includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml
  linux: ./build/linux/Taskfile.yml

vars:
  APP_NAME: marksafe
  BIN_DIR: bin
  PACKAGE_MANAGER: npm
  VITE_PORT: '{{.WAILS_VITE_PORT | default 34116}}'
  # Target OS for build/package/run; override with GOOS=... for cross-compilation.
  GOOS: '{{.GOOS | default OS}}'
  # Wails v3 beta defaults Linux to GTK4 + WebKitGTK 6.0; `gtk3` selects
  # GTK3 + webkit2gtk-4.1, which is what our build hosts and CI provide.
  LINUX_TAGS: gtk3
  # Optional modules, off for public builds. SENSOR=1 builds the connection
  # to the MLC Sensor Monitor in (Go tag "sensormonitor", frontend variant
  # in frontend/.variant, see sensormonitor/ and frontend/vite.config.ts).
  SENSOR: '{{.SENSOR | default ""}}'
  SENSOR_TAG: '{{if eq .SENSOR "1"}}sensormonitor{{end}}'
  # Build tags of the platform builds (the Windows and macOS tasks read it
  # globally); Linux adds LINUX_TAGS in the build task.
  EXTRA_TAGS: '{{.SENSOR_TAG}}'
  # Output names of a module build: marksafe-1.9.0-sensormonitor-…
  VARIANT_SUFFIX: '{{if .SENSOR_TAG}}-sensormonitor{{end}}'
  VERSION:
    sh: cat VERSION 2>/dev/null || echo "1.5.1"
  DROPZONE: /mnt/data2tb/dropzone
  # MarkSafe ships the MLC PDF toolkit mlcdoc (PDF preview and export).
  # Pinned release, checksum-verified; mlcext/mlcdoc.MinVersion must not be newer.
  MLCDOC_VERSION: 0.16.0
  MLCDOC_DIST: '{{.MLCDOC_DIST | default (printf "/mnt/data2tb/dropzone/mlcdoc/%s" .MLCDOC_VERSION)}}'
  MLCDOC_DIR: '{{.ROOT_DIR}}/build/mlcdoc/{{.MLCDOC_VERSION}}'

tasks:
  default:
    desc: List all available tasks
    cmds:
      - task --list
    silent: true

  dev:
    desc: Run the app in development mode (wails3 dev)
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}

  build:
    desc: Build the application for the host OS (or GOOS=...); SENSOR=1 with the Sensor Monitor module
    cmds:
      # The version from VERSION in every file (installers, packages, page).
      - task: version:sync
      - task: variant
      - task: "{{.GOOS}}:build"
        vars:
          DEV: '{{.DEV}}'
          EXTRA_TAGS: '{{if eq .GOOS "linux"}}{{.LINUX_TAGS}}{{if .SENSOR_TAG}},{{end}}{{end}}{{.SENSOR_TAG}}'
      # Linux: mlcdoc ships next to the binary (and in the deb/rpm, nfpm.yaml).
      - task: mlcdoc:fetch
      - '{{if eq .GOOS "linux"}}cp "{{.MLCDOC_DIR}}/linux/mlcdoc" "{{.BIN_DIR}}/mlcdoc"{{else}}true{{end}}'

  package:
    desc: Package a production build for the host OS (or GOOS=...)
    cmds:
      - task: variant
      - task: "{{.GOOS}}:package"
        vars:
          EXTRA_TAGS: '{{if eq .GOOS "linux"}}{{.LINUX_TAGS}}{{if .SENSOR_TAG}},{{end}}{{end}}{{.SENSOR_TAG}}'

  variant:
    desc: Write the frontend build variant (frontend/.variant) for SENSOR=1 or the standard build
    cmds:
      - echo "{{if .SENSOR_TAG}}sensormonitor{{else}}standard{{end}}" > frontend/.variant

  run:
    desc: Run the built application
    cmds:
      - task: "{{.GOOS}}:run"

  bindings:
    desc: Generate the TypeScript bindings (frontend/bindings)
    cmds:
      - wails3 generate bindings -f '-tags {{.LINUX_TAGS}}{{if .SENSOR_TAG}},{{.SENSOR_TAG}}{{end}}' -clean=true -ts -i

  version:sync:
    desc: Write the version from VERSION into config, installers, packages, README and the product page
    cmds:
      - ./scripts/sync-version.sh

  version:set:
    desc: "Set a new version and sync it everywhere: task version:set -- 1.7.0"
    cmds:
      - echo "{{.CLI_ARGS}}" > VERSION
      - task: version:sync

  version:check:
    desc: Fail when a file does not carry the version from VERSION (writes nothing)
    cmds:
      - ./scripts/sync-version.sh --check

  mlcdoc:fetch:
    desc: Extract the pinned mlcdoc release (Windows + Linux binary, licenses) into build/mlcdoc for bundling
    status:
      - test -f "{{.MLCDOC_DIR}}/windows/mlcdoc.exe"
      - test -f "{{.MLCDOC_DIR}}/linux/mlcdoc"
      - test -f "{{.MLCDOC_DIR}}/darwin/mlcdoc"
    cmds:
      - cd "{{.MLCDOC_DIST}}" && sha256sum -c --ignore-missing SHA256SUMS
      - rm -rf "{{.MLCDOC_DIR}}" && mkdir -p "{{.MLCDOC_DIR}}/windows" "{{.MLCDOC_DIR}}/linux" "{{.MLCDOC_DIR}}/darwin"
      # macOS: universal binary + licenses from the DMG (7z reads APFS images)
      - 7z e -y -o"{{.MLCDOC_DIR}}/darwin" "{{.MLCDOC_DIST}}/mlcdoc-{{.MLCDOC_VERSION}}-macos-universal.dmg" mlcdoc "Dokumentation/LICENSE*" "Dokumentation/NOTICE*" > /dev/null
      - chmod 755 "{{.MLCDOC_DIR}}/darwin/mlcdoc"
      - 7z e -y -o"{{.MLCDOC_DIR}}/windows" "{{.MLCDOC_DIST}}/mlcdoc-{{.MLCDOC_VERSION}}-windows-x64-setup.exe" mlcdoc.exe "doc/LICENSE*" "doc/NOTICE*" > /dev/null
      - |
        tmp=$(mktemp -d)
        dpkg-deb -x "{{.MLCDOC_DIST}}/mlcdoc_{{.MLCDOC_VERSION}}-1_amd64.deb" "$tmp"
        cp "$tmp/usr/bin/mlcdoc" "{{.MLCDOC_DIR}}/linux/"
        cp "$tmp"/usr/share/doc/mlcdoc/LICENSE* "$tmp"/usr/share/doc/mlcdoc/NOTICE* "{{.MLCDOC_DIR}}/linux/"
        rm -rf "$tmp"
      - echo "mlcdoc {{.MLCDOC_VERSION}} ready in {{.MLCDOC_DIR}}"

  build:windows:
    desc: Build the Windows executable & NSIS installer (AMD64, cross-compiled), with mlcdoc; SENSOR=1 with the Sensor Monitor module
    cmds:
      # The version from VERSION in every file (installers, packages, page).
      - task: version:sync
      - task: variant
      - task: mlcdoc:fetch
      - task: windows:package
        vars:
          ARCH: amd64
          MLCDOC_DIR: '{{.MLCDOC_DIR}}/windows'
      # The installer must contain mlcdoc (project.nsi can be regenerated by wails3).
      - |
        if ! 7z l "{{.BIN_DIR}}/marksafe-amd64-installer.exe" | grep -q " mlcdoc.exe$"; then
          echo "ERROR - installer without mlcdoc.exe" >&2
          exit 1
        fi
      # Portable use: mlcdoc next to the executable.
      - cp "{{.MLCDOC_DIR}}/windows/mlcdoc.exe" "{{.BIN_DIR}}/mlcdoc.exe"

  build:macos:remote:
    desc: "Build and sign the macOS universal .app + .dmg on macstudio via SSH → /mnt/data2tb/dropzone/marksafe-{VERSION}.dmg"
    vars:
      MAC_HOST: mlc@macstudio.fritz.box
      REMOTE_DIR: marksafe-build
    cmds:
      # The version from VERSION in every file (installers, packages, page).
      - task: version:sync
      - task: variant
      # 0 — mlcdoc ships inside marksafe.app (build/mlcdoc is synced along)
      - task: mlcdoc:fetch
      # 1 — sync source to macstudio
      - |
        rsync -az --delete \
          --exclude='.git' --exclude='bin/' --exclude='build/bin/' --exclude='dist/' --exclude='.task/' \
          --exclude='node_modules/' --exclude='frontend/node_modules/' --exclude='frontend/dist/' --exclude='frontend/bindings/' \
          --exclude='mlcprodweb/' \
          . {{.MAC_HOST}}:{{.REMOTE_DIR}}/
        echo "→ Source synced to {{.MAC_HOST}}:{{.REMOTE_DIR}}"
      # 2 — build and sign on macstudio
      - |
        KEYCHAIN_PASS="${MAC_KEYCHAIN_PASS:-${MARKSAFE_KEYCHAIN_PASS:-${MLCTERM_KEYCHAIN_PASS:-${KEYCHAIN_PASS:-}}}}"
        if [ -z "$KEYCHAIN_PASS" ]; then
          echo "HINWEIS: MAC_KEYCHAIN_PASS (oder MARKSAFE_/MLCTERM_KEYCHAIN_PASS) ist nicht gesetzt."
          echo "Ohne Passwort bleibt der Mac-Schlüsselbund gesperrt; codesign & Notarisierung werden übersprungen."
        fi
        ssh {{.MAC_HOST}} "KEYCHAIN_PASS=$KEYCHAIN_PASS MLCDOC_VERSION={{.MLCDOC_VERSION}} EXTRA_TAGS={{.SENSOR_TAG}} bash -s" << 'ENDSSH'
          set -e
          export PATH=$PATH:/usr/local/go/bin:$HOME/go/bin:/opt/homebrew/bin
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
          cd ~/marksafe-build

          VERSION=$(cat VERSION 2>/dev/null || echo "1.5.1")
          echo "→ Building MarkSafe v${VERSION} on macOS (universal)..."

          # EXTRA_TAGS: sensormonitor for SENSOR=1 (frontend/.variant came along)
          wails3 task darwin:package:universal ${EXTRA_TAGS:+EXTRA_TAGS=$EXTRA_TAGS}

          # mlcdoc next to the executable (PDF preview/export finds it there)
          MLCDOC_SRC="build/mlcdoc/${MLCDOC_VERSION}/darwin"
          install -m 755 "$MLCDOC_SRC/mlcdoc" bin/marksafe.app/Contents/MacOS/mlcdoc
          mkdir -p bin/marksafe.app/Contents/Resources/licenses/mlcdoc
          cp "$MLCDOC_SRC"/LICENSE-* "$MLCDOC_SRC"/NOTICE-* bin/marksafe.app/Contents/Resources/licenses/mlcdoc/
          # Sensor Monitor module (SENSOR=1): its own license (ELv2)
          if [ -n "$EXTRA_TAGS" ]; then cp sensormonitor/LICENSE bin/marksafe.app/Contents/Resources/licenses/LICENSE-sensormonitor; fi
          bin/marksafe.app/Contents/MacOS/mlcdoc --version

          if [ -n "$KEYCHAIN_PASS" ]; then
            echo "→ Unlocking keychain and signing bin/marksafe.app..."
            security unlock-keychain -p "$KEYCHAIN_PASS" ~/Library/Keychains/login.keychain-db
            # Nested executable first, with hardened runtime (notarization needs it)
            codesign --force --options runtime --timestamp \
              --sign "Developer ID Application: Michael Lechner (BQQQX4TB3B)" \
              bin/marksafe.app/Contents/MacOS/mlcdoc
            wails3 tool sign --input bin/marksafe.app \
              --identity "Developer ID Application: Michael Lechner (BQQQX4TB3B)" \
              --entitlements build/signing/marksafe.entitlements \
              --notarize --keychain-profile mlcterm-notary
            codesign --verify --strict --verbose=2 bin/marksafe.app
            xcrun stapler validate bin/marksafe.app
          else
            echo "→ Skipping codesign & notarization for .app (no KEYCHAIN_PASS provided)."
          fi

          echo "→ Building .dmg with create-dmg..."
          mkdir -p build/release
          rm -f "build/release/marksafe-${VERSION}.dmg"
          create-dmg \
            --volname "MarkSafe ${VERSION}" \
            --window-pos 200 150 --window-size 660 440 --icon-size 120 \
            --icon "marksafe.app" 180 180 --hide-extension "marksafe.app" \
            --app-drop-link 480 180 \
            --no-internet-enable --skip-jenkins \
            "build/release/marksafe-${VERSION}.dmg" "bin/marksafe.app"

          if [ -n "$KEYCHAIN_PASS" ]; then
            echo "→ Signing and notarizing .dmg..."
            codesign --force --sign "Developer ID Application: Michael Lechner (BQQQX4TB3B)" \
                     --timestamp "build/release/marksafe-${VERSION}.dmg"
            xcrun notarytool submit "build/release/marksafe-${VERSION}.dmg" \
                  --keychain-profile mlcterm-notary --wait
            xcrun stapler staple "build/release/marksafe-${VERSION}.dmg"
            xcrun stapler validate "build/release/marksafe-${VERSION}.dmg"
          fi

          echo "→ Done: build/release/marksafe-${VERSION}.dmg"
        ENDSSH
      # 3 — copy .dmg back to dropzone
      - mkdir -p {{.DROPZONE}} {{.BIN_DIR}}
      - scp "{{.MAC_HOST}}:{{.REMOTE_DIR}}/build/release/marksafe-{{.VERSION}}.dmg" {{.DROPZONE}}/marksafe-{{.VERSION}}{{.VARIANT_SUFFIX}}.dmg
      - '{{if not .SENSOR_TAG}}cp {{.DROPZONE}}/marksafe-{{.VERSION}}.dmg {{.DROPZONE}}/marksafe.dmg{{else}}true{{end}}'
      - cp {{.DROPZONE}}/marksafe-{{.VERSION}}{{.VARIANT_SUFFIX}}.dmg {{.BIN_DIR}}/marksafe-{{.VERSION}}{{.VARIANT_SUFFIX}}.dmg
      - echo "Successfully published macOS DMG to {{.DROPZONE}}/marksafe-{{.VERSION}}{{.VARIANT_SUFFIX}}.dmg"

  build:all:
    desc: Build Linux binary and Windows installer
    cmds:
      - task: build
      - task: build:windows

  release:
    desc: Build all platforms and copy installers to dropzone (SENSOR=1 → files named …-sensormonitor-…, not for publish:downloads)
    vars:
      N: 'marksafe-{{.VERSION}}{{.VARIANT_SUFFIX}}'
    cmds:
      - task: build:all
      - mkdir -p {{.DROPZONE}}
      - cp {{.BIN_DIR}}/marksafe-amd64-installer.exe {{.DROPZONE}}/{{.N}}-windows-setup.exe
      - cp {{.BIN_DIR}}/marksafe.exe {{.DROPZONE}}/{{.N}}-windows.exe
      - cp {{.BIN_DIR}}/marksafe {{.DROPZONE}}/{{.N}}-linux-amd64
      # Unversioned names only for the public (standard) build.
      - '{{if not .SENSOR_TAG}}cp {{.BIN_DIR}}/marksafe-amd64-installer.exe {{.DROPZONE}}/marksafe-amd64-installer.exe && cp {{.BIN_DIR}}/marksafe {{.DROPZONE}}/marksafe{{else}}true{{end}}'
      # Licenses for the portable packages: MarkSafe (MIT), mlcdoc with its
      # third-party notices, and in a SENSOR=1 build the module (ELv2).
      - |
        rm -rf "{{.BIN_DIR}}/licenses" && mkdir -p "{{.BIN_DIR}}/licenses/mlcdoc"
        cp LICENSE "{{.BIN_DIR}}/licenses/LICENSE-marksafe"
        cp "{{.MLCDOC_DIR}}"/linux/LICENSE-* "{{.MLCDOC_DIR}}"/linux/NOTICE-* "{{.BIN_DIR}}/licenses/mlcdoc/"
        {{if .SENSOR_TAG}}cp sensormonitor/LICENSE "{{.BIN_DIR}}/licenses/LICENSE-sensormonitor"{{else}}true{{end}}
      # Portable Windows/Linux: zip with mlcdoc next to MarkSafe (PDF preview/export).
      - cd {{.BIN_DIR}} && rm -f {{.N}}-windows-portable.zip && 7z a -tzip -bso0 {{.N}}-windows-portable.zip marksafe.exe mlcdoc.exe licenses
      - cd {{.BIN_DIR}} && tar -czf {{.N}}-linux-amd64.tar.gz marksafe mlcdoc licenses
      - cp {{.BIN_DIR}}/{{.N}}-windows-portable.zip {{.BIN_DIR}}/{{.N}}-linux-amd64.tar.gz {{.DROPZONE}}/
      - echo "Successfully published MarkSafe {{.VERSION}}{{.VARIANT_SUFFIX}} to {{.DROPZONE}}"

  publish:downloads:
    desc: "Upload release binaries from dropzone to mlcgo.eu:/var/www/html/downloads/marksafe"
    # Public downloads are the standard build only (no Sensor Monitor module).
    preconditions:
      - sh: '[ -z "{{.SENSOR_TAG}}" ]'
        msg: "Builds with the Sensor Monitor module (SENSOR=1) are not published."
    vars:
      WEB_DEST: '{{.WEB_DEST | default "mlc@mlcgo.eu:/var/www/html/downloads/marksafe"}}'
    cmds:
      - |
        set -eu
        ssh mlc@mlcgo.eu "mkdir -p /var/www/html/downloads/marksafe"
        pairs="
        {{.DROPZONE}}/marksafe-{{.VERSION}}-windows-setup.exe|marksafe-windows-setup.exe
        {{.DROPZONE}}/marksafe-{{.VERSION}}-windows.exe|marksafe-windows.exe
        {{.DROPZONE}}/marksafe-{{.VERSION}}-linux-amd64|marksafe-linux
        {{.DROPZONE}}/marksafe-{{.VERSION}}.dmg|marksafe-macos.dmg
        {{.DROPZONE}}/marksafe-{{.VERSION}}-windows-portable.zip|marksafe-windows-portable.zip
        {{.DROPZONE}}/marksafe-{{.VERSION}}-linux-amd64.tar.gz|marksafe-linux-amd64.tar.gz
        "
        missing=0
        sent=0
        for pair in $pairs; do
          src="${pair%%|*}"; dst="${pair##*|}"
          if [ ! -f "$src" ]; then
            echo "  — übersprungen: $(basename "$src") nicht gefunden"
            missing=$((missing+1))
            continue
          fi
          rsync -avh "$src" "{{.WEB_DEST}}/$dst"
          rsync -avh "$src" "{{.WEB_DEST}}/$(basename "$src")"
          echo "  ✓ $(basename "$src") → $dst (und als $(basename "$src"))"
          sent=$((sent+1))
        done
        echo "────────────────────────────────────"
        echo "  {{.WEB_DEST}}"
        echo "  $sent hochgeladen, $missing übersprungen"

  check:
    desc: Run Svelte check and Go tests
    cmds:
      - task: version:check
      - task: bindings
      - cd frontend && npm run check
      - go test -tags {{.LINUX_TAGS}} ./...
      # the optional Sensor Monitor module (built in only with SENSOR=1)
      - go vet -tags {{.LINUX_TAGS}},sensormonitor . ./sensormonitor/...
      - go test -tags {{.LINUX_TAGS}},sensormonitor ./sensormonitor/...
      # mlcext is its own module (MLC Markdown Extension checker), not part of ./...
      - cd mlcext && go test ./...

  install:
    desc: Install backend and frontend dependencies
    cmds:
      - go mod tidy
      - cd frontend && npm install

  tidy:
    desc: Tidy go modules
    cmds:
      - go mod tidy
