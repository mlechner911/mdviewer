version: '3'

vars:
  VERSION:
    sh: cat VERSION 2>/dev/null || echo "1.3.1"
  DROPZONE: /mnt/data2tb/dropzone

tasks:
  default:
    desc: List all available tasks
    cmds:
      - task --list
    silent: true

  dev:
    desc: Run wails dev with xvfb
    cmds:
      - xvfb-run -a wails dev -devserver localhost:34117

  build:
    desc: Build the application for Linux (AMD64)
    cmds:
      - wails build -ldflags "-X main.appVersion={{.VERSION}}"

  build:windows:
    desc: Build the Windows executable & NSIS installer (AMD64)
    cmds:
      - wails build -platform windows/amd64 -nsis -ldflags "-X main.appVersion={{.VERSION}}"

  build:all:
    desc: Build Linux binary and Windows installer
    cmds:
      - task build
      - task build:windows

  release:
    desc: Build all platforms and copy installers to dropzone
    cmds:
      - task build:all
      - mkdir -p {{.DROPZONE}}
      - cp build/bin/marksafe-amd64-installer.exe {{.DROPZONE}}/marksafe-{{.VERSION}}-windows-setup.exe
      - cp build/bin/marksafe-amd64-installer.exe {{.DROPZONE}}/marksafe-amd64-installer.exe
      - cp build/bin/marksafe.exe {{.DROPZONE}}/marksafe-{{.VERSION}}-windows.exe
      - cp build/bin/marksafe {{.DROPZONE}}/marksafe-{{.VERSION}}-linux-amd64
      - cp build/bin/marksafe {{.DROPZONE}}/marksafe
      - echo "Successfully published MarkSafe {{.VERSION}} to {{.DROPZONE}}"

  check:
    desc: Run Svelte check and Go tests
    cmds:
      - cd frontend && npm run check
      - go test ./...

  install:
    desc: Install backend and frontend dependencies
    cmds:
      - go mod tidy
      - cd frontend && npm install

  tidy:
    desc: Tidy go modules
    cmds:
      - go mod tidy
